name: Build Windows

# Builds only on request: a push to the `release` branch (done by Claude
# when asked), or "Run workflow" in the Actions tab. Pushes to main don't build.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # NOX_BUILD is how a running Nox knows whether a release is newer.
      - run: flutter build windows --release --dart-define=NOX_BUILD=${{ github.run_number }}

      - uses: actions/upload-artifact@v7
        with:
          name: nox-windows
          path: build/windows/x64/runner/Release/

      # Each build of main becomes a release; Nox offers it as an update.
      - name: Publish release
        if: github.ref == 'refs/heads/release' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath nox-windows.zip
          gh release create "build-${{ github.run_number }}" nox-windows.zip --title "Nox ${{ github.run_number }}" --generate-notes --target "${{ github.sha }}"
